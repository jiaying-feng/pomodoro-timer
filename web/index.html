<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>番茄钟</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='11' fill='%23e85d3a'/%3E%3Cpath d='M16 6c1-3 4-4 6-3-2 2-2 4-1 5-2-1-4-1-5-2z' fill='%237d9a78'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-mode="focus">
  <div class="app">
    <header class="top">
      <div>
        <p class="brand">番茄钟</p>
        <p class="date" id="date"></p>
      </div>
      <div class="top-actions">
        <p class="today" id="today">今天还没开始</p>
        <button class="icon-btn" id="settingsBtn" type="button" aria-label="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 15.4a3.4 3.4 0 1 1 0-6.8 3.4 3.4 0 0 1 0 6.8Zm8.2-3.9-.1-1.2-2-.4a6.8 6.8 0 0 0-.8-1.9l1.1-1.7-1.1-1.1-1.7 1.1a6.8 6.8 0 0 0-1.9-.8l-.4-2h-1.2l-.4 2a6.8 6.8 0 0 0-1.9.8L7.1 4.2 6 5.3l1.1 1.7c-.3.6-.6 1.2-.8 1.9l-2 .4-.1 1.2.1 1.2 2 .4c.2.7.5 1.3.8 1.9L6 17.7l1.1 1.1 1.7-1.1c.6.3 1.2.6 1.9.8l.4 2h1.2l.4-2c.7-.2 1.3-.5 1.9-.8l1.7 1.1 1.1-1.1-1.1-1.7c.3-.6.6-1.2.8-1.9l2-.4.1-1.2Z"/>
          </svg>
        </button>
      </div>
    </header>

    <label class="task">
      <span>此刻</span>
      <input id="task" maxlength="80" placeholder="只写一件事" autocomplete="off" />
    </label>

    <div class="stage">
      <div class="dial">
        <svg viewBox="0 0 220 220" aria-hidden="true">
          <circle class="ring-track" cx="110" cy="110" r="92" />
          <circle class="ring-progress" id="ring" cx="110" cy="110" r="92" />
        </svg>
        <div class="readout">
          <p class="time" id="time">25:00</p>
          <p class="phase" id="phase"><i id="pulse"></i><span id="phaseLabel">专注</span></p>
        </div>
      </div>
      <p class="hint" id="hint">只做这一件事</p>
    </div>

    <div class="controls">
      <button class="primary" id="toggle" type="button">开始</button>
      <div class="ghosts">
        <button class="ghost" id="reset" type="button">重置</button>
        <button class="ghost" id="skip" type="button">跳过</button>
      </div>
      <div class="cycle" id="cycle" aria-label="本轮四个番茄"></div>
    </div>

    <div class="modes" role="tablist" aria-label="阶段">
      <button class="mode" type="button" data-mode="focus" role="tab">专注<span>25 分钟</span></button>
      <button class="mode" type="button" data-mode="short" role="tab">短休<span>5 分钟</span></button>
      <button class="mode" type="button" data-mode="long" role="tab">长休<span>15 分钟</span></button>
    </div>
  </div>

  <div class="sheet" id="sheet" hidden>
    <button class="backdrop" id="backdrop" type="button" aria-label="关闭设置"></button>
    <section class="sheet-card" role="dialog" aria-labelledby="sheetTitle">
      <header class="sheet-head">
        <h2 id="sheetTitle">设置</h2>
        <button class="icon-btn" id="closeSettings" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.7 5.3 12 10.6l5.3-5.3 1.4 1.4L13.4 12l5.3 5.3-1.4 1.4L12 13.4l-5.3 5.3-1.4-1.4L10.6 12 5.3 6.7z"/></svg>
        </button>
      </header>

      <div class="field" data-mode-row="focus">
        <span>专注</span>
        <div class="stepper">
          <button type="button" data-step="focus" data-dir="-1" aria-label="减少专注时长">−</button>
          <input id="min-focus" type="number" min="1" max="180" inputmode="numeric" aria-label="专注分钟" />
          <button type="button" data-step="focus" data-dir="1" aria-label="增加专注时长">+</button>
        </div>
      </div>
      <div class="field">
        <span>短休息</span>
        <div class="stepper">
          <button type="button" data-step="short" data-dir="-1" aria-label="减少短休息">−</button>
          <input id="min-short" type="number" min="1" max="180" inputmode="numeric" aria-label="短休息分钟" />
          <button type="button" data-step="short" data-dir="1" aria-label="增加短休息">+</button>
        </div>
      </div>
      <div class="field">
        <span>长休息</span>
        <div class="stepper">
          <button type="button" data-step="long" data-dir="-1" aria-label="减少长休息">−</button>
          <input id="min-long" type="number" min="1" max="180" inputmode="numeric" aria-label="长休息分钟" />
          <button type="button" data-step="long" data-dir="1" aria-label="增加长休息">+</button>
        </div>
      </div>
      <p class="fine">每完成 4 个专注，进入一次长休息。单位是分钟。</p>

      <label class="switch"><input id="opt-sound" type="checkbox" />提示音</label>
      <label class="switch"><input id="opt-auto" type="checkbox" />到点后自动开始下一阶段</label>
      <label class="switch"><input id="opt-top" type="checkbox" />窗口置顶</label>
      <p class="fine" id="topHint" hidden>窗口置顶只在桌面窗口里生效。</p>
    </section>
  </div>

  <script src="main.js"></script>
</body>
</html>
